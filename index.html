<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Location Appartements</title>
  
  <!-- CSS de la page -->
  <link rel="stylesheet" href="css\shared.css" />
  <link rel="stylesheet" href="css/index.css" />
  <!-- CSS de la navbar et footer (optionnel si inclus dedans) -->
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
</head>

<body>
  <!-- 🔼 Chargement dynamique de la navbar -->
  <div id="navbar-container"></div>

  <section id="carousel-section">
    <div class="banner">
      <h1>Terra Noble Stays</h1>
      <h3>Votre slogan ou une description</h3>
  
      <div class="carousel">
        <div class="carousel-images">
          <div class="carousel-image-wrapper">
            <img src="images/appartement1.png" alt="Appartement 1" class="carousel-image">
            <div class="overlay"></div>
            <div class="image-caption">Quarteira</div>
          </div>
          <div class="carousel-image-wrapper">
            <img src="images/appartement2.png" alt="Appartement 2" class="carousel-image">
            <div class="overlay"></div>
            <div class="image-caption">Vilamoura</div>
          </div>
          <div class="carousel-image-wrapper">
            <img src="images/appartement3.png" alt="Appartement 3" class="carousel-image">
            <div class="overlay"></div>
            <div class="image-caption">Olhao</div>
          </div>
        </div>
      </div>
    </div>
  
    <button class="carousel-prev">&#10094;</button>
    <button class="carousel-next">&#10095;</button>
  </section>
  



  <!-- 📝 Texte de présentation -->
  <section class="presentation">
    <h2 data-i18n="index_intro_title"></h2>
    <p data-i18n="index_intro_text"></p>
    <a href="list-appartements.html" class="cta-button" data-i18n="index_see_apartments"></a>
  </section>

  <!-- 🔽 Chargement dynamique du footer -->
  <div id="footer-container"></div>

  <!-- Fichiers JavaScript -->
  <script src="js/translation.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
